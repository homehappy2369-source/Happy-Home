<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio - Toko Kami</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mengambil icon dari Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Bagian Profil -->
        <header class="profile">
            <!-- Ganti src dengan link foto logo/profil tokomu -->
            <img src="LOGO HAPPY HOME.png" alt="Logo Toko" class="profile-img">
            <h1 class="name">HAPPY HOME</h1>
            <p class="bio">Pusat Alat Rumah Tangga dan Elektronik terlengkap di Wonosobo. </p>
        </header>

        <!-- Bagian Link -->
        <main class="links">
            <!-- Link WhatsApp (Ganti nomornya, pastikan pakai 62 bukan 0) -->
            <a href="https://wa.me/6285600445497" target="_blank" class="link-btn">
                <i class="fab fa-whatsapp icon-wa"></i> Hubungi WhatsApp
            </a>

            <!-- Link Instagram -->
            <a href="https://instagram.com/happyhomewonosobo" target="_blank" class="link-btn">
                <i class="fab fa-instagram icon-ig"></i> Follow Instagram Kami
            </a>

            <!-- Link Website Toko -->
            <a href="https://happyhomewonosobo.id" target="_blank" class="link-btn">
                <i class="fas fa-shopping-cart icon-web"></i> Kunjungi Website Toko
            </a>

            <!-- Link Google Maps -->
            <a href="https://maps.app.goo.gl/E28Y8bLh7Ym2uC1i9?g_st=ic" target="_blank" class="link-btn">
                <i class="fas fa-map-marker-alt icon-maps"></i> Lokasi Toko (Google Maps)
            </a>
        </main>

        <!-- Fitur Bagikan -->
        <footer>
            <button id="shareBtn" class="share-btn">
                <i class="fas fa-share-alt"></i> Bagikan Halaman Ini
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
